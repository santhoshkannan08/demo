<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Snake Game</title>
    <style>
        /* CSS: Styling the game and the page */
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h1 {
            margin-bottom: 10px;
            color: #4CAF50;
            text-shadow: 0 0 10px rgba(76, 175, 80, 0.5);
        }

        #score-board {
            font-size: 24px;
            margin-bottom: 20px;
        }

        /* The Game Board Box */
        #game-board {
            width: 400px;
            height: 400px;
            background-color: #000000;
            border: 4px solid #b617a9;
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.3);
            position: relative;
        }

        /* The Snake Blocks */
        .snake {
            width: 20px;
            height: 20px;
            background-color: #4CAF50;
            border: 1px solid #da1616;
            box-sizing: border-box;
            position: absolute;
            border-radius: 4px;
        }

        /* The Snake Head looks slightly different */
        .snake-head {
            background-color: #8BC34A;
        }

        /* The Food Block */
        .food {
            width: 20px;
            height: 20px;
            background-color: #FF5722;
            border-radius: 50%;
            position: absolute;
            box-shadow: 0 0 8px #11db0a;
        }

        /* Game Over text setup */
        #game-over-screen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #game-over-screen p {
            font-size: 30px;
            color: #FF5722;
            margin-bottom: 20px;
            font-weight: bold;
        }

        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 18px;
            font-family: inherit;
            cursor: pointer;
            border-radius: 50px;
            transition: 0.2s;
        }

        button:hover {
            background-color: #8BC34A;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <h1>SNAKE GAME</h1>
    <div id="score-board">Score: <span id="score">0</span></div>

    <div id="game-board">
        <!-- Game Over overlay layer -->
        <div id="game-over-screen" id="game-over-screen">
            <p>GAME OVER</p>
            <button onclick="resetGame()">Play Again</button>
        </div>
    </div>

    <script>
        // JavaScript: Game logic
        const board = document.getElementById("game-board");
        const scoreDisplay = document.getElementById("score");
        const gameOverScreen = document.getElementById("game-over-screen");

        const blockSize = 20; // Each grid box is 20x20 pixels
        const totalRows = 20; // 400px / 20px = 20 rows
        const totalCols = 20; // 400px / 20px = 20 columns

        let snake, food, direction, nextDirection, score, gameInterval;

        // Start the game for the first time
        resetGame();

        function resetGame() {
            // 1. Clear previous snake elements from board (keep game-over screen)
            const blocks = board.querySelectorAll('.snake, .food');
            blocks.forEach(block => block.remove());

            // 2. Initial Setup
            snake = [
                { x: 10, y: 10 }, // Head
                { x: 10, y: 11 }, // Body segment 1
                { x: 10, y: 12 }  // Body segment 2
            ];
            direction = { x: 0, y: -1 }; // Moving UP at start
            nextDirection = { x: 0, y: -1 };
            score = 0;
            scoreDisplay.innerText = score;
            gameOverScreen.style.display = "none";

            // 3. Spawn food and start timer loop
            spawnFood();
            clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, 150); // Moves every 150 milliseconds
        }

        function gameLoop() {
            // Update movement direction safely
            direction = nextDirection;

            // Calculate new head position
            const newHead = {
                x: snake[0].x + direction.x,
                y: snake[0].y + direction.y
            };

            // Check if snake hits the outer walls
            if (newHead.x < 0 || newHead.x >= totalCols || newHead.y < 0 || newHead.y >= totalRows) {
                return gameOver();
            }

            // Check if snake hits its own body
            for (let i = 0; i < snake.length; i++) {
                if (newHead.x === snake[i].x && newHead.y === snake[i].y) {
                    return gameOver();
                }
            }

            // Move the head forward
            snake.unshift(newHead);

            // Check if snake eats the food
            if (newHead.x === food.x && newHead.y === food.y) {
                score += 10;
                scoreDisplay.innerText = score;
                spawnFood();
            } else {
                // If it didn't eat food, remove the last tail piece to keep it moving forward
                snake.pop();
            }

            // Redraw everything on screen
            draw();
        }

        function draw() {
            // Remove old visual elements to draw fresh ones
            const existingBlocks = board.querySelectorAll('.snake, .food');
            existingBlocks.forEach(block => block.remove());

            // Draw Snake
            snake.forEach((segment, index) => {
                const element = document.createElement("div");
                element.style.left = `${segment.x * blockSize}px`;
                element.style.top = `${segment.y * blockSize}px`;
                element.classList.add("snake");
                if (index === 0) element.classList.add("snake-head");
                board.appendChild(element);
            });

            // Draw Food
            const foodElement = document.createElement("div");
            foodElement.style.left = `${food.x * blockSize}px`;
            foodElement.style.top = `${food.y * blockSize}px`;
            foodElement.classList.add("food");
            board.appendChild(foodElement);
        }

        function spawnFood() {
            // Pick a random grid coordinate for food
            food = {
                x: Math.floor(Math.random() * totalCols),
                y: Math.floor(Math.random() * totalRows)
            };

            // Don't spawn food directly on top of the snake's body
            for (let i = 0; i < snake.length; i++) {
                if (food.x === snake[i].x && food.y === snake[i].y) {
                    spawnFood();
                    break;
                }
            }
        }

        function gameOver() {
            clearInterval(gameInterval);
            gameOverScreen.style.display = "flex";
        }

        // Listen for Arrow Keys to steer the snake
        window.addEventListener("keydown", (e) => {
            switch (e.key) {
                case "ArrowUp":
                    if (direction.y === 0) nextDirection = { x: 0, y: -1 };
                    break;
                case "ArrowDown":
                    if (direction.y === 0) nextDirection = { x: 0, y: 1 };
                    break;
                case "ArrowLeft":
                    if (direction.x === 0) nextDirection = { x: -1, y: 0 };
                    break;
                case "ArrowRight":
                    if (direction.x === 0) nextDirection = { x: 1, y: 0 };
                    break;
            }
        });
    </script>
</body>
</html>
