<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glowing Heart ❤️</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background:
        radial-gradient(circle at center, #260018 0%, #10000c 45%, #030003 100%);
      font-family: Arial, sans-serif;
    }

    .scene {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Glowing heart */
    .heart {
      position: relative;
      width: 150px;
      height: 150px;
      background: linear-gradient(135deg, #ff1744, #ff0055);
      transform: rotate(-45deg);
      animation: heartbeat 1.2s infinite ease-in-out;

      box-shadow:
        0 0 20px #ff1744,
        0 0 40px #ff1744,
        0 0 70px #ff0055,
        0 0 110px rgba(255, 0, 85, 0.8);
    }

    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 150px;
      height: 150px;
      background: inherit;
      border-radius: 50%;
    }

    .heart::before {
      top: -75px;
      left: 0;
    }

    .heart::after {
      top: 0;
      left: 75px;
    }

    @keyframes heartbeat {
      0%, 100% {
        transform: rotate(-45deg) scale(1);
      }

      15% {
        transform: rotate(-45deg) scale(1.12);
      }

      30% {
        transform: rotate(-45deg) scale(1);
      }

      45% {
        transform: rotate(-45deg) scale(1.08);
      }

      60% {
        transform: rotate(-45deg) scale(1);
      }
    }

    /* Inner shine */
    .shine {
      position: absolute;
      z-index: 5;
      width: 35px;
      height: 18px;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 50%;
      transform: rotate(45deg);
      top: -5px;
      left: 25px;
      filter: blur(4px);
      animation: shine 1.2s infinite ease-in-out;
    }

    @keyframes shine {
      0%, 100% {
        opacity: 0.4;
      }

      50% {
        opacity: 1;
      }
    }

    /* Floating glowing particles */
    .particle {
      position: absolute;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #ff4d88;
      box-shadow:
        0 0 8px #ff4d88,
        0 0 20px #ff0066;
      pointer-events: none;
      animation: floatUp linear forwards;
    }

    @keyframes floatUp {
      from {
        transform: translateY(0) scale(0.5);
        opacity: 0;
      }

      15% {
        opacity: 1;
      }

      to {
        transform: translateY(-100vh) scale(1.5);
        opacity: 0;
      }
    }

    /* Text */
    .message {
      position: absolute;
      top: 68%;
      color: #fff;
      font-size: 24px;
      letter-spacing: 3px;
      text-shadow:
        0 0 10px #ff1744,
        0 0 25px #ff0055;
      animation: textGlow 2s infinite alternate;
    }

    @keyframes textGlow {
      from {
        opacity: 0.65;
        text-shadow: 0 0 8px #ff1744;
      }

      to {
        opacity: 1;
        text-shadow:
          0 0 10px #ff1744,
          0 0 30px #ff0055;
      }
    }

    @media (max-width: 600px) {
      .heart {
        width: 110px;
        height: 110px;
      }

      .heart::before,
      .heart::after {
        width: 110px;
        height: 110px;
      }

      .heart::before {
        top: -55px;
      }

      .heart::after {
        left: 55px;
      }

      .message {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <div class="scene">

    <div class="heart">
      <div class="shine"></div>
    </div>

    <div class="message">
      Made With Love ❤️
    </div>

  </div>

  <script>
    // Create glowing particles
    function createParticle() {
      const particle = document.createElement("div");
      particle.classList.add("particle");

      // Random horizontal position
      particle.style.left = Math.random() * 100 + "vw";

      // Start near the bottom
      particle.style.top = (80 + Math.random() * 20) + "vh";

      // Random size
      const size = Math.random() * 5 + 2;
      particle.style.width = size + "px";
      particle.style.height = size + "px";

      // Random animation duration
      const duration = Math.random() * 4 + 3;
      particle.style.animationDuration = duration + "s";

      document.querySelector(".scene").appendChild(particle);

      // Remove after animation
      setTimeout(() => {
        particle.remove();
      }, duration * 1000);
    }

    // Generate particles continuously
    setInterval(createParticle, 120);

    // Create initial particles
    for (let i = 0; i < 30; i++) {
      setTimeout(createParticle, i * 100);
    }
  </script>

</body>
</html>
